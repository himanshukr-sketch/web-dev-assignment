<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form </h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" minlength="3" maxlength="30" required>
        <br><br>

        <!--Email-->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!--Password-->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <br><br>

        <!--Mobile Number-->
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required>
        <br><br>

        <!--Age-->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="17" max="30" required>
        <br><br>

        <!--Gender-->
        <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female" required>
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

        <!--Course-->
            <label for="course" name="course">Select course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech CSE</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BBA">BBA</option>
            </select>
            <br><br> 
            
        <!--Date of Birth-->
        <label for="dob">Date Of Birth</label>  
        <input type="date" id="dob" name="dob" max="2026-10-26" required>
        <br><br>  

        <!--Website-->
        <label for="website"> Website:</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">
        <br><br>

        <!--Terms and Condition-->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions.</label>
        <br><br>

        <!--Buttons-->
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
        



    </form>
    

    </details>
    
</body>
</html>
